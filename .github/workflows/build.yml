name: test-build-publish

on:
  push:
    branches: [main]
    # Accept both 'vX.Y.Z' and 'X.Y.Z' tags. The repo convention (per
    # MEMORY.md and the homelab-mcp image tag policy) is to publish
    # GHCR images as 'X.Y.Z' (no v prefix); the v-prefix form is kept
    # for symmetry with other repos and to make the version jump
    # visually distinct in the tag list.
    tags: ["v*", "[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.7"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}
      - name: Sync dependencies
        # The pyproject has both [project.optional-dependencies].dev and
        # [dependency-groups].dev. `uv sync --group dev` is the modern
        # form (PEP 735); `--extra dev` keeps older uv working.
        run: uv sync --group dev --extra dev
      - name: Lint
        run: uv run ruff check .
      - name: Test
        # HOMELAB_MCP_LIVE=0 keeps the live SSH integration tests skipped
        # in CI. They're only run on-demand against a real host (see
        # tests/live/README.md). Setting 0 explicitly prevents accidental
        # activation if a contributor has a HOMELAB_MCP_LIVE_HOST_NAME
        # in their environment.
        env:
          HOMELAB_MCP_LIVE: "0"
        run: uv run pytest -ra --tb=short

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: |
            homelab-mcp:ci-${{ github.sha }}
            homelab-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: [test, build]
    # Match both 'refs/tags/vX.Y.Z' and 'refs/tags/X.Y.Z' (no-v form).
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Extract version
        id: version
        run: |
          # Strip 'refs/tags/' and an optional 'v' prefix. Works for both
          # 'v0.4.0' and '0.4.0' tag forms.
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/homelab-mcp:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/homelab-mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=homelab-mcp
            org.opencontainers.image.description=MCP server: homelab diagnostics + auto-update pipeline
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
