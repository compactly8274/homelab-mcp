[project]
name = "homelab-mcp"
version = "0.5.0"
description = "MCP server: homelab diagnostics + auto-update pipeline (SAFE+CAUTION apply, BREAKING notify)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    "fastmcp>=0.4.0,<0.5.0",
    "httpx>=0.27,<1.0",
    "docker>=7.1,<8.0",
    "asyncssh>=2.17,<3.0",
    "aiosqlite>=0.20,<1.0",
    "pydantic>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
# Kept for back-compat with older uv that doesn't recognize
# PEP 735 [dependency-groups]. Newer uv should use `uv sync --group dev`.
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.6,<1.0",
]

[dependency-groups]
# PEP 735: dev dependencies. Newer uv versions prefer this over
# project.optional-dependencies. We keep both for back-compat with
# older uv.
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.6,<1.0",
]

[project.scripts]
homelab-mcp = "homelab_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["homelab_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM", "RUF012", "E701", "E702"]
